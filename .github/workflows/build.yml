name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Proyecto KMP: en Linux los targets de Apple simplemente no se construyen,
      # así que `build` cubre JVM, JS, Linux y Windows. De Apple se encarga el job `apple`.
      - run: ./gradlew build

  # Los targets de Apple no se pueden construir en Linux, y en un Mac sin Xcode el build los
  # omite. Sin este job no se probarían en ningún sitio, y el soporte iOS sería solo una
  # declaración en el build.gradle.kts. Los runners de macOS sí traen Xcode.
  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew macosArm64Test iosSimulatorArm64Test
