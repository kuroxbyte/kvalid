name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Proyecto KMP: en Linux los targets de Apple simplemente no se construyen,
      # así que `build` cubre JVM, JS, Linux y Windows.
      - run: ./gradlew build
