[versions]
mavenPublish = "0.32.0"
kotlin = "2.1.21"
ksp = "2.1.21-2.0.1"
genkit = "0.1.0"
kctfork = "0.7.0"
konsist = "0.17.3"
junit = "5.11.4"
kotlinx-serialization = "1.7.3"
ktor = "3.0.3"
jmh = "0.7.2"
kover = "0.9.1"
hibernate-validator = "8.0.1.Final"
expressly = "5.0.0"
spring = "6.1.14"
springBoot = "3.3.5"   # Boot 3.3.5 va con Spring Framework 6.1.14
jacksonKotlin = "2.17.2"  # alineado con el BOM de Boot 3.3.5

[libraries]
genkit-model = { module = "io.github.kuroxbyte:genkit-model", version.ref = "genkit" }
genkit-ports = { module = "io.github.kuroxbyte:genkit-ports", version.ref = "genkit" }
kspkit = { module = "io.github.kuroxbyte:kspkit", version.ref = "genkit" }
genkit-emit = { module = "io.github.kuroxbyte:genkit-emit", version.ref = "genkit" }
aptkit = { module = "io.github.kuroxbyte:aptkit", version.ref = "genkit" }
kotlinpoet = { module = "com.squareup:kotlinpoet", version = "2.0.0" }
javapoet = { module = "com.squareup:javapoet", version = "1.13.0" }
ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kctfork-ksp = { module = "dev.zacsweers.kctfork:ksp", version.ref = "kctfork" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
hibernate-validator = { module = "org.hibernate.validator:hibernate-validator", version.ref = "hibernate-validator" }
expressly = { module = "org.glassfish.expressly:expressly", version.ref = "expressly" }
spring-web = { module = "org.springframework:spring-web", version.ref = "spring" }
spring-context = { module = "org.springframework:spring-context", version.ref = "spring" }
spring-webmvc = { module = "org.springframework:spring-webmvc", version.ref = "spring" }
spring-webflux = { module = "org.springframework:spring-webflux", version.ref = "spring" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure", version.ref = "springBoot" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "springBoot" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux", version.ref = "springBoot" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation", version.ref = "springBoot" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "springBoot" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jacksonKotlin" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
jmh = { id = "me.champeau.jmh", version.ref = "jmh" }
